name: Bot Scouting Crypto

on:
  schedule:
    # Berjalan otomatis setiap 4 jam sekali UTC (00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  run-scoutbot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scoutbot Script
        run: python botscout.py
